<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102a2c" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      try {
        const stored = localStorage.getItem('mix-it-language');
        const preferred = stored || (navigator.language.toLowerCase().startsWith('nl') ? 'nl' : 'en');
        document.documentElement.lang = preferred === 'nl' ? 'nl-BE' : 'en';
      } catch {
        // The static Dutch page remains the no-storage fallback.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
